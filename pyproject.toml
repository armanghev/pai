[project]
name = "pai"
version = "0.1.0"
description = "Pai, a personal assistant owl that talks over Telegram"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.13",
    "cryptography>=50.0.2",
    "httpx>=0.27",
    "plaid-python>=45.0.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-telegram-bot[job-queue]>=22.8",  # 22.8: send_message_draft for streaming
    "yt-dlp>=2025.1",
]

[project.scripts]
pai = "pai.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: makes real network calls (opt in with -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
